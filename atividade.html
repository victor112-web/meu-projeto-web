<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha pessoal</title>
    <link rel="stylesheet" href="atividade.css">
</head>

<body>

    <main class="ficha">

        <div class="foto">
            <img src="anonimo.png" alt="Foto de perfil">
        </div>

        <div class="dados">

            <div class="campo nome">
                Nome completo
            </div>

            <div class="linha">
                <div class="campo">
                    Data: 00/00/0000
                </div>

                <div class="campo">
                    CPF: 000.000.000-00
                </div>
            </div>

            <div class="linha">
                <div class="campo">
                    Cidade: Cidade
                </div>

                <div class="campo">
                    Estado: Estado
                </div>
            </div>

        </div>

    </main>

</body>
</html>
